  /api/organizations/{organization_pk}/projects/{project_pk}/tasks/:
    get:
      operationId: organizations_projects_tasks_list
      description: Resolve the URL's project, only if the caller is allowed to see
        it.
      parameters:
      - in: query
        name: assigned_to_me
        schema:
          type: boolean
      - in: query
        name: assignee_email
        schema:
          type: string
      - in: query
        name: due_after
        schema:
          type: string
          format: date
      - in: query
        name: due_before
        schema:
          type: string
          format: date
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -created_at
            - -due_date
            - -priority
            - -title
            - -updated_at
            - created_at
            - due_date
            - priority
            - title
            - updated_at
        description: |-
          Ordering

          * `due_date` - Due date
          * `-due_date` - Due date (descending)
          * `created_at` - Created at
          * `-created_at` - Created at (descending)
          * `updated_at` - Updated at
          * `-updated_at` - Updated at (descending)
          * `title` - Title
          * `-title` - Title (descending)
          * `priority` - Priority
          * `-priority` - Priority (descending)
        explode: false
        style: form
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: query
        name: overdue
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: array
          items:
            type: string
            enum:
            - high
            - low
            - medium
            - urgent
        description: |-
          * `low` - Low
          * `medium` - Medium
          * `high` - High
          * `urgent` - Urgent
        explode: true
        style: form
      - in: path
        name: project_pk
        schema:
          type: integer
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - done
            - in_progress
            - in_review
            - todo
        description: |-
          * `todo` - To Do
          * `in_progress` - In Progress
          * `in_review` - In Review
          * `done` - Done
        explode: true
        style: form
      - in: query
        name: unassigned
        schema:
          type: boolean
      tags:
      - organizations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskList'
          description: ''
    post:
      operationId: organizations_projects_tasks_create
      description: Resolve the URL's project, only if the caller is allowed to see
        it.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - in: path
        name: project_pk
        schema:
          type: integer
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
