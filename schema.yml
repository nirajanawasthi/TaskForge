      - details
      - id
    ActivityActionEnum:
      enum:
      - task_created
      - task_updated
      - assignee_changed
      - status_changed
      - comment_added
      type: string
      description: |-
        * `task_created` - Task created
        * `task_updated` - Task updated
        * `assignee_changed` - Assignee changed
        * `status_changed` - Status changed
        * `comment_added` - Comment added
    AddMember:
      type: object
      properties:
        email:
          type: string
          format: email
