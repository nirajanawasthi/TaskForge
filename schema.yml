      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMember'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddMember'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddMember'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/organizations/{organization_pk}/members/{id}/:
    patch:
      operationId: organizations_members_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChangeRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChangeRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChangeRole'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    delete:
      operationId: organizations_members_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - organizations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/organizations/{organization_pk}/projects/:
    get:
      operationId: organizations_projects_list
      description: |-
        Resolve the caller's membership in the URL's organization.

        check_permissions runs ensure_visible() first, so anything the caller may
        not see answers 404 before any role check can answer 403.
      parameters:
      - in: query
        name: is_private
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -created_at
            - -name
            - -updated_at
            - created_at
            - name
            - updated_at
        description: |-
          Ordering

          * `name` - Name
          * `-name` - Name (descending)
          * `created_at` - Created at
          * `-created_at` - Created at (descending)
          * `updated_at` - Updated at
          * `-updated_at` - Updated at (descending)
        explode: false
        style: form
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - organizations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: organizations_projects_create
      description: |-
        Resolve the caller's membership in the URL's organization.

        check_permissions runs ensure_visible() first, so anything the caller may
        not see answers 404 before any role check can answer 403.
      parameters:
      - in: path
        name: organization_pk
        schema:
          type: integer
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
