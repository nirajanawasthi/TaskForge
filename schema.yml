          type: integer
          readOnly: true
        author:
          type: string
          format: email
          readOnly: true
          nullable: true
        body:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - body
      - created_at
      - id
      - updated_at
