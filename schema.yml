      type: string
      description: |-
        * `task_assigned` - Task assigned
        * `review_requested` - Review requested
        * `changes_requested` - Changes requested
        * `task_approved` - Task approved
        * `task_reopened` - Task reopened
        * `comment_added` - Comment added
